---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-meta" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<nav class="post-nav">
  {% if page.previous %}
    <a class="post-nav-prev" href="{{ page.previous.url | relative_url }}">
      <span>Previous</span>{{ page.previous.title }}
    </a>
  {% endif %}
  {% if page.next %}
    <a class="post-nav-next" href="{{ page.next.url | relative_url }}">
      <span>Next</span>{{ page.next.title }}
    </a>
  {% endif %}
</nav>
